<style>
:root{--bg:#0b0f14;--card:#11161d;--line:#21262d;--txt:#e6edf3;--mute:#8b949e;
--up:#ff5f56;--dn:#4f9cf9;--oi:#e3a008;--ok:#3fb950;--warn:#f778ba}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;
line-height:1.6;padding:18px 14px}
.wrap{max-width:1560px;margin:0 auto}
h1{font-size:22px;margin:0 0 3px}
.sub{color:var(--mute);font-size:13px;margin-bottom:16px}
.bar{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start;margin:6px 0}
.row .lb{color:var(--mute);font-size:12px;width:52px;flex:none;padding-top:4px}
.chip{background:#1a2029;border:1px solid var(--line);color:var(--mute);border-radius:999px;
padding:3px 11px;font-size:12.5px;cursor:pointer;user-select:none;white-space:nowrap}
/* 칩 컨테이너를 flex-wrap으로 — 안 하면 칩 «안에서» 줄바꿈돼 글자가 쪼개진다 */
.row > span[id^="f_"]{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.chip:hover{border-color:#3d4653;color:var(--txt)}
.chip.on{background:var(--oi);border-color:var(--oi);color:#0b0f14;font-weight:700}
/* 위 칩을 누르면 여기에 «선택한 조합»과 그 결과 그룹이 뜬다 */
.combo{margin-top:10px;background:#131a24;border:1px solid #2b3543;
border-left:4px solid #4f9cf9;border-radius:9px;padding:10px 12px}
.combo .ttl{color:var(--dn);font-weight:700;font-size:12.5px;margin-bottom:7px}
.combo .sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.cb{background:var(--dn);color:#04121f;border-radius:6px;padding:3px 9px;font-size:12.5px;font-weight:700}
.cb .x{margin-left:6px;cursor:pointer;opacity:.75}
.cb .x:hover{opacity:1}
.cb .ax{color:#04121f;opacity:.6;font-size:11px;font-weight:600;margin-right:4px}
.combo .plus{color:var(--mute);font-size:13px}
.combo .none{color:var(--mute);font-size:12.5px}
.gbtns{display:flex;flex-wrap:wrap;gap:6px}
.gb{background:#1a2029;border:1px solid #2f3b4a;border-radius:7px;padding:5px 10px;
font-size:12.5px;cursor:pointer;color:var(--txt)}
.gb:hover{border-color:var(--oi);color:var(--oi)}
.gb.on{background:var(--oi);border-color:var(--oi);color:#0b0f14;font-weight:700}
.gb i{color:var(--mute);font-style:normal;font-size:11px;margin-left:5px}
.gb.on i{color:#0b0f14;opacity:.7}

/* 검색 줄은 «가장 먼저 눈에 띄어야» 하므로 별도 박스 + 주황 강조 */
.searchbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:9px;
background:#18202b;border:1px solid #2f3b4a;border-left:4px solid var(--oi);
border-radius:9px;padding:10px 12px}
.searchbox .lb{color:var(--oi);font-weight:700;font-size:12.5px;width:48px;flex:none}
.sw{position:relative;display:inline-block}
.sw::before{content:'🔍';position:absolute;left:11px;top:50%;transform:translateY(-50%);
font-size:14px;opacity:.85;pointer-events:none}
input[type=search]{background:#0d1218;border:2px solid var(--oi);color:var(--txt);border-radius:8px;
padding:9px 12px 9px 34px;font-size:14.5px;width:380px;font-family:inherit;
box-shadow:0 0 0 3px rgba(227,160,8,.10)}
input[type=search]::placeholder{color:#7d8896}
input[type=search]:focus{outline:none;border-color:#ffc93c;background:#111823;
box-shadow:0 0 0 4px rgba(227,160,8,.28)}
input[type=search]:not(:placeholder-shown){background:#1c1608;border-color:#ffc93c}
.searchbox .hint{color:var(--mute);font-size:11.5px}
@media(max-width:720px){input[type=search]{width:100%}}
.layout{display:grid;grid-template-columns:330px 1fr;gap:12px}
@media(max-width:1080px){.layout{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.plist{max-height:74vh;overflow-y:auto}
.gitem{padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.gitem:hover{background:#161d26}
.gitem.on{background:#1d2733;border-left:3px solid var(--oi);padding-left:9px}
.sitem{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sitem:hover{background:#161d26}
.sitem .t{font-size:13px;font-weight:600}
.sitem .g{color:var(--oi);font-size:11px;margin-top:1px}
.sitem .s{color:var(--mute);font-size:11px}
tr.hl td{background:rgba(227,160,8,.20)!important;box-shadow:inset 0 0 0 1px var(--oi)}
mark{background:var(--oi);color:#0b0f14;border-radius:2px;padding:0 1px}
.csbtn{font-size:11.5px;padding:1px 8px;border-radius:999px;cursor:pointer;
background:#1a2029;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.csbtn:hover{border-color:var(--dn);color:var(--dn)}
.csbtn.on{background:var(--dn);border-color:var(--dn);color:#04121f;font-weight:700}
tr.csrow td{background:#0d1319;border-bottom:1px solid var(--line)}
.cswrap{padding:10px 4px 12px}
.cshead{color:var(--dn);font-weight:700;font-size:12.5px;margin-bottom:8px}
.csgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:5px 14px}
/* 상세 패널 안에서는 「N개 ETF」 배지까지 들어가야 하므로 칸을 넓게 */

.dlg .csbar{width:44px}.dlg .csitem .w{width:48px}
.csitem{display:flex;align-items:center;gap:7px;font-size:12.5px}
.csitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.csitem .w{color:var(--oi);font-weight:700;width:52px;text-align:right;flex:none}
.csbar{height:4px;border-radius:2px;background:#1f2731;width:64px;flex:none;overflow:hidden}
.csbar i{display:block;height:100%;background:var(--dn)}
.csitem a{color:inherit}.csitem a:hover{color:var(--dn);text-decoration:underline}
.nmlink{cursor:pointer;border-bottom:1px dotted #3d4653}
.nmlink:hover{color:var(--oi);border-bottom-color:var(--oi)}

.dlg .hd .sub2{color:var(--mute);font-size:12.5px;margin-top:3px}
.dlg .bd{padding:14px 18px 18px}
.x2{cursor:pointer;color:var(--mute);font-size:20px;line-height:1;padding:2px 6px;flex:none}

.warnbox{background:#2a1520;border:1px solid #5c2340;border-radius:8px;padding:9px 12px;margin:10px 14px;font-size:12.5px}

 {k:'tr', t:'1년 총수익%', sign:true, d:2, hi:'max'},
 {k:'dv', t:'괴리율%',   d:2},
 {k:'bi', t:'기초지수',  num:false},
];

// 검색은 «공백 무시 + 토큰 전부 일치(AND)».
// 상품명이 「미국배당커버드콜」처럼 붙어 있어서, 사용자가 「미국 배당 커버드콜」로 치면
// 단순 부분일치로는 0건이 나온다. 토큰별로 나눠 검사하고 공백 제거본도 같이 본다.
function hay(i){
  if(!i._h){ const t=(i.n+' '+i.c+' '+i.g+' '+(i.bi||'')+' '+i.br).toLowerCase();
             i._h=t; i._hs=t.replace(/[\s·\/()]/g,''); }
  return i;
}
function matches(i){
  if(!F.qt.length) return true;
  hay(i);
  return F.qt.every(t=>i._h.includes(t)||i._hs.includes(t.replace(/[\s·\/()]/g,'')));
}
const FKEYS=['as','rg','st','th'];
function pass(i){
  return FKEYS.every(k=>!F[k]||i[k]===F[k]) && matches(i);
}
function chips(id,key){
  const el=$('#'+id); el.innerHTML='';
  D.facets[key].forEach(v=>{
    const c=document.createElement('span'); c.className='chip'+(F[key]===v?' on':'');
    c.textContent=(v==='-'?'지역무관':v);
    c.onclick=()=>{F[key]=(F[key]===v?null:v); F.g=null; F.hl=null; hashPut(); render();};
    el.appendChild(c);
  });
}
function combo(gs){
  const el=$('#combo');
  const picked=[['자산군','as'],['지역','rg'],['섹터','th'],['전략','st']].filter(([,k])=>F[k]);
  let h='<div class="ttl">선택한 조합</div><div class="sel">';
  if(!picked.length){
    h+='<span class="none">위의 <b>자산군 · 지역 · 섹터 · 전략</b> 칩을 누르면 조합이 여기에 만들어지고, '
      +'아래에 해당 그룹이 뜹니다. <b>예: 섹터 반도체</b> 또는 <b>미국 + 커버드콜</b></span>';
  }else{
    h+=picked.map(([lb,k])=>
      `<span class="cb"><span class="ax">${lb}</span>${F[k]==='-'?'지역무관':F[k]}`
      +`<span class="x" data-k="${k}">✕</span></span>`).join('<span class="plus">+</span>');
  }
  h+='</div>';
  const items=D.items.filter(pass);
  const top=gs.slice(0,30);
  h+=`<div class="ttl" style="color:var(--oi)">이 조합의 그룹 ${gs.length}개 `
    +`<span class="mute" style="font-weight:400">· 종목 ${items.length}개`
    +`${gs.length>30?' · 시총 상위 30개만 표시':''}</span></div>`;
  h+='<div class="gbtns">'+(top.length? top.map(x=>
      `<span class="gb${F.g===x.g?' on':''}" data-g="${esc(x.g)}">${esc(x.g)}<i>${x.n}</i></span>`).join('')
      : '<span class="none">해당하는 그룹이 없습니다</span>')+'</div>';
  el.innerHTML=h;
  el.querySelectorAll('.cb .x').forEach(e=>e.onclick=()=>{
    F[e.dataset.k]=null; F.g=null; F.hl=null; hashPut(); render();});
  el.querySelectorAll('.gb').forEach(e=>e.onclick=()=>{
    F.g=e.dataset.g; F.hl=null; hashPut(); render();});
}
function render(){
  chips('f_as','as'); chips('f_rg','rg'); chips('f_st','st'); chips('f_th','th');
  const items=D.items.filter(pass);
  const by={}; items.forEach(i=>(by[i.g]=by[i.g]||[]).push(i));
  const gs=Object.keys(by).map(g=>({g,n:by[g].length,mc:by[g].reduce((a,b)=>a+b.mc,0)}))
            .sort((a,b)=>b.mc-a.mc);
  $('#cnt').textContent=`${items.length}종목 / ${gs.length}그룹`;
  $('#gn').textContent=gs.length;
  combo(gs);
  if(F.q){ searchList(items); return; }
  if(F.hl && F.g){ /* 상품 직링크 — 그룹 전체를 동료로 보여준다 */ }
  $('#glabel').innerHTML='그룹 <span class="mute" id="gn">'+gs.length+'</span>';
  $('#ghint').textContent='시총 합계 순 · 클릭하면 오른쪽에서 비교';
  $('#glist').innerHTML = gs.length? gs.map(x=>
    `<div class="gitem${F.g===x.g?' on':''}" data-g="${x.g.replace(/"/g,'&quot;')}">
       <div class="t">${x.g}</div>
       <div class="s">${x.n}종목 · 시총 ${x.mc.toLocaleString()}억</div></div>`).join('')
    : '<div class="empty">조건에 맞는 그룹이 없습니다</div>';
  $('#glist').querySelectorAll('.gitem').forEach(e=>e.onclick=()=>{
    F.g=e.dataset.g; F.hl=null; hashPut(); render();});
  if(F.g && by[F.g]) table(by[F.g]); else if(F.g){F.g=null; table(null);} else table(null);
}

// ───────── 상품 상세 (앱 안에서 봄 — 네이버로 나가지 않는다)
let REV=null;                       // 개별 종목 → 그 종목을 담은 ETF 역인덱스
function revIndex(){
  if(REV) return REV;
  REV={};
  D.items.forEach(it=>(it.cs||[]).forEach(([nm,w,cd])=>{
    const k=cd||('N:'+nm); (REV[k]=REV[k]||[]).push([it,w]);
  }));
  Object.values(REV).forEach(a=>a.sort((x,y)=>(y[1]||0)-(x[1]||0)));
  return REV;
}
function closeDlg(){ const o=$('.ovl'); if(o) o.remove(); }
function fmtv(v,d,suf){ return (v===null||v===undefined)?'-':v.toLocaleString(undefined,
  {minimumFractionDigits:d,maximumFractionDigits:d})+(suf||''); }
function sign(v,d){ if(v===null||v===undefined) return '<span class="mute">-</span>';
  return `<span class="${v>0?'up':(v<0?'dn':'mute')}">${v>0?'+':''}${v.toFixed(d)}%</span>`; }

function openDetail(code, stockKey){
  const r=D.items.find(i=>i.c===code); if(!r) return;
  closeDlg();
  const mx=Math.max(...(r.cs||[]).map(x=>x[1]||0))||1;
  const cs=(r.cs||[]).map(([nm,w,cd])=>{
    const key=cd||('N:'+nm), cnt=(revIndex()[key]||[]).length;
    const label = `<span class="nmlink" data-stock="${esc(key)}">${esc(nm)}</span>`
      + (cd?`<a class="ext" href="https://m.stock.naver.com/domestic/stock/${cd}" target="_blank" title="네이버에서 보기">↗</a>`
           :'<span class="tag">해외</span>')
      + (cnt>1?`<span class="tag">${cnt}개 ETF</span>`:'');
    return `<div class="csitem"><span class="nm">${label}</span>`
         + `<span class="csbar"><i style="width:${Math.round((w||0)/mx*100)}%"></i></span>`
         + `<span class="w">${w!=null?w.toFixed(2)+'%':'-'}</span></div>`;
  }).join('');

  let peer='';
  if(stockKey){
    const lst=(revIndex()[stockKey]||[]).slice(0,14);
    const nm0=stockKey.startsWith('N:')?stockKey.slice(2):(lst[0]?(lst[0][0].cs.find(x=>(x[2]||('N:'+x[0]))===stockKey)||['?'])[0]:'?');
    peer=`<div class="peer"><b>「${esc(nm0)}」을(를) 담은 ETF ${(revIndex()[stockKey]||[]).length}개</b>
      <span class="mute">(비중 높은 순, 상위 ${lst.length})</span><div class="csgrid" style="margin-top:7px">`
      + lst.map(([it,w])=>`<div class="csitem"><span class="nm">
          <span class="nmlink" data-c="${it.c}">${esc(it.n)}</span></span>
          <span class="w">${w!=null?w.toFixed(2)+'%':'-'}</span></div>`).join('')
      + `</div><div class="mute" style="margin-top:7px;font-size:11.5px">
         ⚠️ 각 ETF의 <b>상위 10개 구성종목</b>만 모아 만든 목록입니다 —
         11위 이하로 담고 있는 ETF는 여기 안 나옵니다. 비중은 그 ETF 안에서의 비중입니다.</div></div>`;
  }

  const o=document.createElement('div'); o.className='ovl';
  o.innerHTML=`<div class="dlg"><div class="hd">
    <div style="flex:1"><h3>${esc(r.n)}</h3>
      <div class="sub2"><span class="tick">${r.c}</span> ${esc(r.br)} · ${esc(r.g)}
      <a class="ext" href="https://m.stock.naver.com/domestic/stock/${r.c}" target="_blank">네이버에서 보기 ↗</a></div></div>
    <span class="x2" id="dlgx">✕</span></div>
    <div class="bd">
      ${r.bi?`<div class="smbox"><b class="k">기초지수</b> ${esc(r.bi)}</div>`:''}
      <div class="kv2">
        <div><div class="l">시총</div><div class="v">${fmtv(r.mc,0,'억')}</div></div>
        <div><div class="l">거래대금</div><div class="v">${fmtv(r.am,0,'억')}</div></div>
        <div><div class="l">총보수</div><div class="v">${fmtv(r.fee,3,'%')}</div></div>
        <div><div class="l">분배율 TTM</div><div class="v">${fmtv(r.dy,2,'%')}</div></div>
        <div><div class="l">연 분배</div><div class="v">${r.dm||0}회</div></div>
        <div><div class="l">괴리율</div><div class="v">${fmtv(r.dv,2,'%')}</div></div>
        <div><div class="l">1개월</div><div class="v">${sign(r.r1,2)}</div></div>
        <div><div class="l">3개월</div><div class="v">${sign(r.r3,2)}</div></div>
        <div><div class="l">1년</div><div class="v">${sign(r.ry,2)}</div></div>
        <div><div class="l">1년 총수익 ○</div><div class="v">${sign(r.tr,2)}</div></div>
        <div><div class="l">NAV</div><div class="v" style="font-size:13px">${r.nav||'-'}</div></div>
        <div><div class="l">52주 고/저</div><div class="v" style="font-size:13px">${r.h52||'-'} / ${r.l52||'-'}</div></div>
      </div>
      ${r.sm?`<div class="smbox">${esc(r.sm)}</div>`:''}
      ${cs?`<div class="cshead" style="margin-top:12px">구성종목 상위 ${r.cs.length}개
        ${r.cn>r.cs.length?`<span class="mute">(전체 ${r.cn}종목 중)</span>`:''}
        <span class="mute">· 종목명을 누르면 그 종목을 담은 다른 ETF가 보입니다 · ↗는 네이버</span></div>
        <div class="csgrid">${cs}</div>`:''}
      ${peer}
    </div></div>`;
  document.body.appendChild(o);
  o.onclick=ev=>{ if(ev.target===o) closeDlg(); };
  $('#dlgx').onclick=closeDlg;
  o.querySelectorAll('.nmlink[data-c]').forEach(e=>e.onclick=()=>openDetail(e.dataset.c));
  o.querySelectorAll('.nmlink[data-stock]').forEach(e=>e.onclick=()=>openDetail(code, e.dataset.stock));
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDlg(); });

function esc(t){return String(t).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function mark(t){
  let out=esc(t);
  if(!F.qt.length) return out;
  // 토큰별로 하이라이트 (긴 토큰 먼저 해야 짧은 게 안쪽을 깨지 않는다)
  F.qt.slice().sort((a,b)=>b.length-a.length).forEach(tok=>{
    const re=new RegExp('('+tok.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    out=out.replace(re,'<mark>$1</mark>');
  });
  return out;
}
function searchList(items){
  const rows=items.slice().sort((a,b)=>b.mc-a.mc);
  const gcnt={}; rows.forEach(r=>gcnt[r.g]=(gcnt[r.g]||0)+1);
  const gks=Object.keys(gcnt).sort((a,b)=>gcnt[b]-gcnt[a]);
  $('#glabel').innerHTML=`검색 결과 <span class="mute">${rows.length}종목 · ${gks.length}그룹</span>`;
  $('#ghint').textContent='그룹(주황)을 누르면 그룹 전체 비교 · 상품을 누르면 그 상품이 강조됩니다';
  const ghead = gks.length? gks.map(g=>
    `<div class="gitem" data-g="${esc(g)}" style="border-left:3px solid var(--oi);padding-left:9px">
       <div class="t" style="color:var(--oi)">${esc(g)}</div>
       <div class="s">검색어와 맞는 ${gcnt[g]}종목 · 그룹 전체 비교하기</div></div>`).join('') : '';
  $('#glist').innerHTML = (rows.length? ghead + rows.map(r=>
    `<div class="sitem" data-c="${r.c}" data-g="${esc(r.g)}">
       <div class="t">${mark(r.n)}</div>
       <div class="g">${esc(r.g)}</div>
       <div class="s"><span class="tick">${r.c}</span> ${r.br} · 시총 ${r.mc.toLocaleString()}억 · 보수 ${r.fee ?? '-'}% · 분배 ${r.dy ?? '-'}%</div>
     </div>`).join('') : '<div class="empty">검색 결과가 없습니다</div>');
  $('#glist').querySelectorAll('.gitem').forEach(e=>e.onclick=()=>{
    F.g=e.dataset.g; F.hl=null; table(D.items.filter(i=>i.g===F.g));});
  $('#glist').querySelectorAll('.sitem').forEach(e=>e.onclick=()=>{
    F.g=e.dataset.g; F.hl=e.dataset.c;
    const peers=D.items.filter(i=>i.g===F.g);   // 그룹 비교는 «필터 무시»하고 전체 동료를 보여준다
    table(peers);
    $('#glist').querySelectorAll('.sitem').forEach(x=>x.style.background='');
    e.style.background='#1d2733';
  });
  table(null);
}
function fmtnum(v,c){
  if(v===null||v===undefined) return '<span class="mute">-</span>';
  const d=c.d??0, s=v.toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
  if(c.sign) return `<span class="${v>0?'up':(v<0?'dn':'mute')}">${v>0?'+':''}${s}</span>`;
  return s+(c.suf||'');
}
function table(rows){
  const warn=$('#warn'), note=$('#note');
  if(!rows){ $('#tbl').innerHTML='<div class="empty">왼쪽에서 그룹을 고르면 나란히 비교됩니다</div>';
    $('#gt').textContent='그룹을 선택하세요'; $('#gs').textContent=''; warn.innerHTML=''; note.innerHTML=''; return; }
  const c=COLS.find(x=>x.k===F.sort)||COLS[2];
  rows=rows.slice().sort((a,b)=>{
    let x=a[F.sort],y=b[F.sort];
    if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
    if(typeof x==='string') return F.dir*x.localeCompare(y,'ko');
    return F.dir*(x-y);
  });
  const ext={};
  COLS.filter(c=>c.hi).forEach(c=>{
    const v=rows.map(r=>r[c.k]).filter(x=>x!==null&&x!==undefined);
    if(v.length>1) ext[c.k]={best:c.hi==='max'?Math.max(...v):Math.min(...v),
                             worst:c.hi==='max'?Math.min(...v):Math.max(...v)};
  });
  const th=COLS.map(c=>`<th data-k="${c.k}" class="${F.sort===c.k?'sorted':''}">${c.t}${F.sort===c.k?(F.dir<0?' ▼':' ▲'):''}</th>`).join('');
  const tr=rows.map(r=>`<tr${F.hl===r.c?' class="hl" data-hl="1"':''}>`+COLS.map(c=>{
    const v=r[c.k]; let cls='';
    if(ext[c.k]&&v!==null&&v!==undefined){ if(v===ext[c.k].best)cls='best'; else if(v===ext[c.k].worst)cls='worst'; }
    const s=(c.num===false)?(c.fmt?c.fmt(v,r):(v||'<span class="mute">-</span>')):fmtnum(v,c);
    return `<td class="${cls}">${s}</td>`;}).join('')+'</tr>').join('');
  $('#tbl').innerHTML=`<table><thead><tr>${th}</tr></thead><tbody>${tr}</tbody></table>`;
  $('#tbl').querySelectorAll('.nmlink[data-c]').forEach(e=>e.onclick=ev=>{
    ev.stopPropagation(); openDetail(e.dataset.c);});
  $('#tbl').querySelectorAll('.csbtn').forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();
    const tr=e.closest('tr'), nx=tr.nextElementSibling;
    if(nx && nx.classList.contains('csrow')){ nx.remove(); e.classList.remove('on'); return; }
    $('#tbl').querySelectorAll('tr.csrow').forEach(x=>x.remove());
    $('#tbl').querySelectorAll('.csbtn.on').forEach(x=>x.classList.remove('on'));
    e.classList.add('on');
    const r=D.items.find(i=>i.c===e.dataset.c); if(!r) return;
    const mx=Math.max(...r.cs.map(x=>x[1]||0))||1;
    const cells=r.cs.map(([nm,w,cd])=>{
      const key=cd||('N:'+nm), cnt=(revIndex()[key]||[]).length;
      const label = `<span class="nmlink" data-stock="${esc(key)}">${esc(nm)}</span>`
        + (cd?`<a class="ext" href="https://m.stock.naver.com/domestic/stock/${cd}" target="_blank" title="네이버">↗</a>`
             :'<span class="tag">해외</span>')
        + (cnt>1?`<span class="tag">${cnt}개 ETF</span>`:'');
      return `<div class="csitem"><span class="nm">${label}</span>`
           + `<span class="csbar"><i style="width:${Math.round((w||0)/mx*100)}%"></i></span>`
           + `<span class="w">${w!=null?w.toFixed(2)+'%':'-'}</span></div>`;
    }).join('');
    const row=document.createElement('tr'); row.className='csrow';
    row.innerHTML=`<td colspan="${COLS.length}"><div class="cswrap">`
      +`<div class="cshead">${esc(r.n)} — 구성종목 상위 ${r.cs.length}개`
      +`${r.cn>r.cs.length?` <span class="mute">(전체 ${r.cn}종목 중)</span>`:''}`
      +` <span class="mute">· 국내 종목은 클릭하면 네이버로</span></div>`
      +`<div class="csgrid">${cells}</div></div></td>`;
    tr.after(row);
    row.querySelectorAll('.nmlink[data-stock]').forEach(x=>x.onclick=()=>openDetail(r.c,x.dataset.stock));
  });
  $('#tbl').querySelectorAll('.tick').forEach(e=>e.onclick=ev=>{
    ev.stopPropagation();
    const t=e.textContent;
    navigator.clipboard?.writeText(t).catch(()=>{});
    const n=document.createElement('div'); n.className='copied'; n.textContent='복사됨: '+t;
    document.body.appendChild(n); setTimeout(()=>n.remove(),1200);
  });
  const hl=$('#tbl').querySelector('tr[data-hl]');
  if(hl){
    hl.scrollIntoView({block:'center'});
    const b=hl.querySelector('.csbtn');          // 상품 직링크는 구성종목까지 펼쳐 보여준다
    if(b && !hl.nextElementSibling?.classList?.contains('csrow')) b.click();
  }
  $('#tbl').querySelectorAll('th').forEach(e=>e.onclick=()=>{
    const k=e.dataset.k; if(F.sort===k)F.dir*=-1; else{F.sort=k;F.dir=-1;} render();});
  const mc=rows.reduce((a,b)=>a+b.mc,0);
  const fees=rows.map(r=>r.fee).filter(x=>x!==null), dys=rows.map(r=>r.dy).filter(x=>x!==null);
  $('#gt').textContent=F.g;
  $('#gs').innerHTML=`${rows.length}종목 · 시총 ${mc.toLocaleString()}억`+
    (fees.length?` · 총보수 ${Math.min(...fees).toFixed(3)}~${Math.max(...fees).toFixed(3)}%`:'')+
    (dys.length?` · 분배율 ${Math.min(...dys).toFixed(1)}~${Math.max(...dys).toFixed(1)}%`:'');
  // 원금잠식 경고 — 분배는 많은데 1년 가격이 마이너스
  const bad=rows.filter(r=>r.dy>4 && r.ry!==null && r.ry<0);
  const thin=rows.filter(r=>r.am<5 && r.mc>0);
  warn.innerHTML = (thin.length? `<div class="warnbox"><b>💧 거래 한산 ${thin.length}종목</b> —
    하루 거래대금이 <b>5억 미만</b>이라 사고팔 때 «호가가 벌어져» 표에 보이는 값보다 불리하게 체결될 수 있습니다:
    ${thin.map(r=>`${r.n}(${r.am}억)`).join(' · ')}</div>`:'') + (bad.length? `<div class="warnbox"><b>⚠️ 원금잠식 의심 ${bad.length}종목</b> —
    분배율이 4% 넘는데 <b>1년 가격이 마이너스</b>입니다. 받은 분배금만큼 기준가가 깎였을 수 있습니다:
    ${bad.map(r=>`${r.n}(분배 ${r.dy}% / 가격 ${r.ry}%)`).join(' · ')}</div>`:'');
  note.innerHTML=`<b class="k">읽는 법</b> — 초록칸은 그룹 안 <b>최고</b>, 분홍칸은 <b>최저</b>입니다(총보수는 낮을수록 초록).
    <b>분배율%</b>는 최근 1년 실제 지급액 기준(TTM), <b>연분배</b>는 올해 분배한 달 수 — 12면 월배당입니다.
    <b>1년 총수익%</b>는 «1년 가격 + 분배율»로 계산한 ○추정치입니다(정확한 분배금 재투자 복리가 아니라 근사).
    <b>괴리율%</b>는 시장가와 순자산가치(NAV)의 차이 — 클수록 비싸게 사는 셈이라 0에 가까울수록 좋습니다.
    거래대금이 작은 종목은 괴리율이 벌어지기 쉬우니 같이 보십시오.`;
}
$('#q').oninput=e=>{setQ(e.target.value); F.g=null; F.hl=null; hashPut(); render();};
$('#reset').onclick=()=>{F={as:null,rg:null,st:null,th:null,q:'',qt:[],g:null,hl:null,sort:'mc',dir:-1};
  $('#q').value=''; hashPut(); render();};
// 해시로 바로 열기 — #g=<그룹명> (그룹 비교) / #q=<검색어> (상품 검색)
function hashPut(){
  const p=[];
  ['as','rg','st','th'].forEach(k=>{ if(F[k]) p.push(k+'='+encodeURIComponent(F[k])); });
  if(F.g) p.push('g='+encodeURIComponent(F.g));
  if(F.q) p.push('q='+encodeURIComponent(F.q));
  history.replaceState(null,'', p.length? '#'+p.join('&') : location.pathname);
}
function fromHash(){
  const g=/[#&]g=([^&]+)/.exec(location.hash), q=/[#&]q=([^&]+)/.exec(location.hash),
        c=/[#&]c=([0-9A-Za-z]+)/.exec(location.hash);
  ['as','rg','st','th'].forEach(k=>{
    const m=new RegExp('[#&]'+k+'=([^&]+)').exec(location.hash);
    try{ F[k]=m?decodeURIComponent(m[1]):null; }catch(e){ F[k]=null; }
  });
  try{ F.g = g? decodeURIComponent(g[1]) : null; }catch(e){ F.g=null; }
  try{ setQ(q? decodeURIComponent(q[1]) : ''); }catch(e){ setQ(''); }
  F.hl = null;
  if(c){                                   // #c=498400 → 그 상품의 그룹을 열고 해당 행을 강조
    const it=D.items.find(i=>i.c===c[1]);
    if(it){ F.g=it.g; F.hl=it.c; setQ(''); }
  }
  $('#q').value = F.q;
}
fromHash();
window.addEventListener('hashchange',()=>{fromHash(); F.hl=null; render();});
// 데이터 신선도 — 평일 15:35 자동 갱신이 조용히 멈추는 것을 눈으로 잡기 위한 표시
(function(){
  const iso=(D.fetched_iso||'').replace(' ','T');
  const d=iso?new Date(iso):null;
  let badge='', warn='';
  if(d && !isNaN(d)){
    const day=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime();
    const dd=Math.round((day(new Date())-day(d))/86400000);
    const cls = dd<=0?'ok':(dd===1?'old':'bad');
    const stamp = (D.fetched||'').slice(5);   // MM-DD HH:MM
    badge=`<span class="fresh ${cls}">데이터 ${stamp}</span>`
         + (SHARE ? '' : `<span class="getbtn" id="getbtn">🔄 최신 데이터 가져오기</span>`);
    if(dd>=2 && !SHARE){
      warn='<div class="staleboard"><b>⚠️ 데이터가 '+dd+'일 지났습니다.</b> '
        +'평일 15:35 자동 갱신이 멈췄을 수 있습니다 — 바탕화면 <b>「→ ETF 데이터 갱신」</b>을 눌러 새로 받아주세요. '
        +'<span class="mute">(계속 이러면 작업 스케줄러의 <code>WAZOSKI_ETF_Refresh</code> 상태와 '
        +'<code>ETF_analysis\\logs\\</code> 로그를 확인)</span></div>';
    }
  }
  $('#sub').innerHTML=`전체 <b>${D.items.length}</b>종목을 <b>${D.groups.length}</b>개 그룹으로 자동 분류 ·
    시세 ${D.fetched} · 보수/분배 ${D.meta_fetched} · 빌드 ${D.built} ${badge}`;
  if(SHARE){
    $('#sub').insertAdjacentHTML('afterend',
      '<div class="howto"><b>이 파일에 대해</b><br>'
      +'국내 상장 ETF <b>'+D.items.length+'종목</b>을 «비슷한 것끼리» '+D.groups.length+'개 그룹으로 묶어 나란히 비교합니다. '
      +'위 <b>자산군 · 지역 · 섹터 · 전략</b> 칩을 눌러 조합을 만들거나, 검색창에 종목명·티커를 넣으세요.<br>'
      +'<b>데이터 기준 시각은 '+(D.fetched||'')+'</b>이며, <b>그 시점의 «스냅샷»</b>입니다 &mdash; 파일을 열어도 새 시세를 받아오지 않습니다.<br>'
      +'<span class="mute">출처: 시세·시총 FinanceDataReader / 총보수·분배율·기초지수 네이버금융. '
      +'분배율은 최근 1년 실지급액(TTM), 「1년 총수익%」는 «가격+분배율» 근사치입니다. '
      +'투자 판단의 근거로 쓰기 전에 각 운용사 공시를 확인하십시오.</span></div>');
  }
  if(warn) $('#sub').insertAdjacentHTML('afterend', warn);
  
})();
render();
(function(){const m=/[#&]d=([0-9A-Za-z]+)/.exec(location.hash);
  const t=/[#&]s=([^&]+)/.exec(location.hash);
  if(m) openDetail(m[1], t?decodeURIComponent(t[1]):null);})();
</script></body></html>
